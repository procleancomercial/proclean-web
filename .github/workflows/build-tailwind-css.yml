name: build-tailwind-css

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build static CSS
        run: npm run build

      - name: Commit generated CSS
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: regenerar assets/css/output.css"
          file_pattern: assets/css/output.css
          skip_dirty_check: false
